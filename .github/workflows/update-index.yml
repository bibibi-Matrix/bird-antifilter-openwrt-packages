name: Update feed index

on:
  push:
    branches: [ "main" ]
    paths:
      - "packages/**/*.apk"
      - ".github/workflows/update-index.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reindex:
    name: reindex-and-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerate apk indexes with apk-tools-static
        run: |
          docker run --rm -w /w -v "$PWD":/w alpine:3.23 sh -c '
            set -eu
            apk add --no-cache apk-tools-static python3 >/dev/null
            echo "apk.static version:"
            /sbin/apk.static --version 2>&1 || true
            for d in packages/x86_64/bird packages/aarch64_cortex-a53/bird; do
              arch=$(basename "$(dirname "$d")")
              echo "==> $d (arch=$arch)"
              cd "/w/$d"
              /sbin/apk.static mkndx --root /w --keys-dir /w --allow-untrusted --output packages.adb *.apk
              /sbin/apk.static adbdump --format json packages.adb > /w/out-${arch}.json
              python3 /w/tools/make-index-json.py -a "$arch" -f apk /w/out-${arch}.json > index.json
              echo "packages.adb: $(stat -c %s packages.adb) bytes"
              echo "index.json packages:"
              python3 -c "import json;print(json.load(open(\"index.json\"))[\"packages\"])"
            done
          '

      - name: Sign packages.adb with feed key
        if: ${{ env.FEED_SIGN_KEY != '' }}
        env:
          FEED_SIGN_KEY: ${{ secrets.FEED_SIGN_KEY }}
        run: |
          docker run --rm -e FEED_SIGN_KEY -w /w -v "$PWD":/w alpine:3.23 sh -c '
            set -eu
            apk add --no-cache apk-tools-static >/dev/null
            echo "$FEED_SIGN_KEY" > /tmp/key-build
            chmod 600 /tmp/key-build
            for d in packages/x86_64/bird packages/aarch64_cortex-a53/bird; do
              echo "==> signing $d/packages.adb"
              /sbin/apk.static --sign-key /tmp/key-build adbsign "/w/$d/packages.adb"
            done
          '

      - name: Commit and push rebuilt indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/x86_64/bird/packages.adb packages/x86_64/bird/index.json \
                  packages/aarch64_cortex-a53/bird/packages.adb packages/aarch64_cortex-a53/bird/index.json
          if git diff --cached --quiet; then
            echo "no index changes"
          else
            git commit -m "reindex feed (packages.adb/index.json)"
            git push
          fi